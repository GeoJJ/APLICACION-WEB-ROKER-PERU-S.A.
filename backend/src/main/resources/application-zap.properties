# Perfil de Marco para analizar una base separada con OWASP ZAP.
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
spring.datasource.url=${ZAP_DATASOURCE_URL:jdbc:postgresql://localhost:5432/roker_bd_zap}
spring.datasource.username=${ZAP_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${ZAP_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
logging.file.name=logs/roker-peru-zap.log
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
