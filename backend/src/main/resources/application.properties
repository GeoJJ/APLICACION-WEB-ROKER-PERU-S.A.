spring.application.name=demo

spring.datasource.url=jdbc:postgresql://localhost:5432/roker_bd
spring.datasource.username=postgres
spring.datasource.password=${ROKER_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# update: Actualiza las tablas automáticamente si cambias algo en tus Entities.
# create: Borra TODA la base de datos y la vuelve a crear cada vez que das Play (Peligroso para producción, útil al inicio).
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
# Muestra en la consola de VSCode el código SQL que Spring Boot hace por detrás
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Nivel general y por paquete
logging.level.root=INFO
logging.level.RokerPeru.demo=DEBUG
logging.level.RokerPeru.demo.services=INFO
logging.level.org.springframework.security=DEBUG

# Guardar en archivo (además de la consola)
logging.file.name=logs/roker-peru.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# Ver las consultas SQL a través de Logback (reemplaza spring.jpa.show-sql)
logging.level.org.hibernate.SQL=DEBUG

# Configuración de JWT
# Esta es una clave Hexadecimal de 256 bits generada aleatoriamente
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

spring.config.import=optional:file:.env[.properties]

springdoc.use-fqn=true
server.servlet.context-path=/roker-backend

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

empresa.razon-social=ROKER PERU S.A.
empresa.ruc=20000000001
empresa.direccion=Av. Ejemplo 123, Arequipa
empresa.logo=reports/logo.png
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
