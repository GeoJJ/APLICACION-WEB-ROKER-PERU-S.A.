spring.application.name=demo

spring.datasource.url=jdbc:postgresql://localhost:5432/roker_bd
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
s
# update: Actualiza las tablas automáticamente si cambias algo en tus Entities.
# create: Borra TODA la base de datos y la vuelve a crear cada vez que das Play (Peligroso para producción, útil al inicio).
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola de VSCode el código SQL que Spring Boot hace por detrás
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true