spring.application.name=demo

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/roker_bd}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# update: Actualiza las tablas automáticamente si cambias algo en tus Entities.
# create: Borra TODA la base de datos y la vuelve a crear cada vez que das Play (Peligroso para producción, útil al inicio).
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola de VSCode el código SQL que Spring Boot hace por detrás
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Nivel general y por paquete
logging.level.root=INFO
logging.level.RokerPeru.demo=DEBUG

# Guardar en archivo (además de la consola)
logging.file.name=logs/roker-peru.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# Ver las consultas SQL a través de Logback (reemplaza spring.jpa.show-sql)
logging.level.org.hibernate.SQL=DEBUG

spring.jpa.open-in-view=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.seed.enabled=${SEED_ENABLED:true}
